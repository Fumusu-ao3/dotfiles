# autostart
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec_once=command -v gnome-keyring-daemon >/dev/null && gnome-keyring-daemon --start --components=secrets
exec_once=awww-daemon
exec_once=sleep 0.5 && ~/.local/bin/wallpaper.sh restore
exec_once=waybar
exec_once=swaync
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=/usr/lib/hyprpolkitagent/hyprpolkitagent
exec_once=kdeconnectd
exec_once=sleep 3 && ~/.local/bin/smart-connect --daemon
exec_once=sleep 3 && ~/.local/bin/ajustes-rapidos --daemon
exec_once=sleep 3 && ~/.local/bin/barra-lateral --daemon
