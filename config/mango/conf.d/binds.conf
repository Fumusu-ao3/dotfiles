# super+f1 muestra todos los atajos

# aplicaciones
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,spawn,foot --app-id floatterm
bind=SUPER,d,spawn,fuzzel
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn,librewolf
bind=SUPER,v,spawn_shell,~/.local/bin/clipboard.sh
bind=SUPER,0,spawn,pavucontrol
bind=SUPER+SHIFT,e,spawn_shell,~/.local/bin/powermenu.sh
bind=SUPER,F1,spawn_shell,~/.local/bin/keybinds.sh
bind=SUPER,n,spawn_shell,swaync-client -t -sw
bind=SUPER+SHIFT,n,spawn_shell,swaync-client -d -sw
bind=SUPER+SHIFT,p,spawn_shell,~/.local/bin/perfil-energia toggle
bind=SUPER+SHIFT,b,spawn,foot --app-id floatterm btop
bind=SUPER,c,spawn_shell,~/.local/bin/smart-connect
bind=SUPER+SHIFT,c,spawn_shell,~/.local/bin/celular
bind=SUPER+ALT,c,spawn_shell,~/.local/bin/celular menu

# barra lateral
bind=SUPER,b,spawn_shell,~/.local/bin/barra-lateral

# wallpaper
bind=SUPER,t,spawn_shell,~/.local/bin/wallpaper.sh gui
bind=SUPER+SHIFT,t,spawn_shell,~/.local/bin/wallpaper.sh random
bind=SUPER+CTRL,t,spawn_shell,~/.local/bin/wallpaper.sh pick
bind=SUPER+ALT,Right,spawn_shell,~/.local/bin/wallpaper.sh next
bind=SUPER+ALT,Left,spawn_shell,~/.local/bin/wallpaper.sh prev
bind=SUPER+ALT,y,spawn_shell,~/.local/bin/lyrics-wallpaper.sh clip
bind=SUPER+ALT+SHIFT,y,spawn_shell,~/.local/bin/lyrics-wallpaper.sh off

# ventanas
bind=SUPER,q,killclient
bind=SUPER,s,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglemaximizescreen
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,m,quit

# foco
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# intercambiar ventanas
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# redimensionar
bind=SUPER+CTRL,Left,resizewin,-20,0
bind=SUPER+CTRL,Right,resizewin,20,0
bind=SUPER+CTRL,Up,resizewin,0,-20
bind=SUPER+CTRL,Down,resizewin,0,20
bind=SUPER+CTRL,h,resizewin,-20,0
bind=SUPER+CTRL,l,resizewin,20,0
bind=SUPER+CTRL,k,resizewin,0,-20
bind=SUPER+CTRL,j,resizewin,0,20

# tags
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER,comma,viewtoleft_have_client
bind=SUPER,period,viewtoright_have_client
bind=CTRL+SUPER+SHIFT,Left,tagtoleft
bind=CTRL+SUPER+SHIFT,Right,tagtoright
bind=ALT,Tab,togglejump

# layouts
bind=SUPER,space,switch_layout
bind=SUPER,a,setlayout,scroller
bind=SUPER,m,setlayout,monocle
bind=SUPER+SHIFT,a,setlayout,tile
bind=SUPER,o,toggleoverview
bind=SUPER,g,togglegaps
bind=SUPER+SHIFT,g,toggleglobal
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,plus,setmfact,+0.05
bind=SUPER,r,switch_proportion_preset

# capturas
bind=SUPER+SHIFT,s,spawn_shell,~/.local/bin/screenshot.sh area
bind=NONE,Print,spawn_shell,~/.local/bin/screenshot.sh full

# multimedia
bind=NONE,XF86AudioRaiseVolume,spawn_shell,~/.local/bin/osd vol up
bind=NONE,XF86AudioLowerVolume,spawn_shell,~/.local/bin/osd vol down
bind=NONE,XF86AudioMute,spawn_shell,~/.local/bin/osd vol mute
bind=NONE,XF86AudioMicMute,spawn_shell,~/.local/bin/osd mic
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn_shell,~/.local/bin/osd brillo up
bind=NONE,XF86MonBrightnessDown,spawn_shell,~/.local/bin/osd brillo down

# mouse / gestos
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
