# teclado
xkb_rules_layout=latam
repeat_rate=50
repeat_delay=300
numlock_on=1

# cursor
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# touchpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0
